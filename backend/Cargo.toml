[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
chrono = { version = "0.4.38", features = ["clock", "serde"], default-features = false }
serde = { version = "1.0.215", features = ["derive"] }
url = { version = "2.5.3", features = ["serde"] }
serde_json = { version = "1.0.133", features = ["preserve_order", "raw_value"] }
tracing = "0.1.40"
anyhow = "1.0.98"
async-trait = "0.1"
activitypub_federation = { version = "0.7.0-beta.11", default-features = false, features = ["axum"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }

# Async runtime and database
tokio = { version = "1.41.1", features = ["full"] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "migrate", "postgres", "chrono" , "json", "ipnetwork"] }

# Tracing and observability (conservative updates)
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.32"
metrics = "0.24.2"
metrics-exporter-prometheus = "0.18"
uuid = { version = "1.17.0", features = ["v4"] }
ipnetwork = "0.21.1"
sha2 = "0.11"
hex = "0.4"

# Web server dependencies (conservative update)
axum = { version = "0.8.9", features = ["json","query","tracing","tokio"] }
tower = "0.5.2"
tower-http = { version = "0.7", features = ["cors", "trace"] }

[dev-dependencies]
# Testing dependencies
tokio-test = "0.4.4"
axum-test = "21"
serde_json = "1.0.133"
tempfile = "3.10.1"

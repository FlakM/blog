{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "content" }}
  <section class="mx-auto max-w-4xl px-5 pb-16 pt-16 sm:px-8 sm:pt-24">
    <header class="mb-12 sm:mb-16">
      <p class="font-mono text-xs uppercase tracking-[0.18em] text-accent">Browse by topic</p>
      <h1 class="mt-4 text-5xl font-black tracking-[-0.05em] text-ink-strong sm:text-7xl">{{ .Title }}</h1>
    </header>
    <div class="flex flex-wrap gap-3">
      {{ range .Data.Terms.Alphabetical }}
        <a href="{{ .Page.RelPermalink }}" class="group inline-flex items-center gap-3 rounded-2xl border border-line bg-panel px-5 py-3 font-semibold text-ink transition-all hover:-translate-y-0.5 hover:border-accent hover:text-accent">
          {{ .Page.Title }}
          <span class="rounded-full bg-panel-raised px-2 py-0.5 font-mono text-xs text-muted group-hover:bg-accent-soft group-hover:text-accent">{{ .Count }}</span>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}

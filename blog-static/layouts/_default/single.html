{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "content" }}
  <section class="mx-auto max-w-3xl px-5 pb-16 pt-16 sm:px-8 sm:pt-24">
    <article>
      <header class="mb-12 sm:mb-16">
        <p class="font-mono text-xs uppercase tracking-[0.18em] text-accent">Page</p>
        <h1 class="mt-4 text-balance text-5xl font-black leading-[1.02] tracking-[-0.05em] text-ink-strong sm:text-7xl">{{ .Title }}</h1>
      </header>
      <div class="prose-blog">{{ .Content }}</div>
    </article>
    {{ partial "posts/math.html" . }}
  </section>
{{ end }}

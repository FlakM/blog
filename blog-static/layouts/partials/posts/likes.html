{{ if .Site.Params.likes.enable }}
  {{ $slug := .File.TranslationBaseName }}
  {{ with .Params.slug }}{{ $slug = . }}{{ end }}
  <section class="mt-20 border-t border-line pt-8" id="like-section-{{ $slug }}">
    <div class="flex items-center gap-3">
      <button
        class="inline-flex min-h-11 items-center gap-2 rounded-xl border border-line bg-panel px-4 py-2 text-sm font-bold text-ink transition-all hover:-translate-y-0.5 hover:border-accent hover:bg-accent-soft hover:text-accent disabled:cursor-wait disabled:opacity-60"
        id="like-btn-{{ $slug }}"
        onclick="handleLike('{{ $slug }}')"
        title="Like this post"
      >
        <svg viewBox="0 0 24 24" class="size-4" id="heart-{{ $slug }}" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>
        <svg viewBox="0 0 24 24" class="hidden size-4 animate-spin" id="spinner-{{ $slug }}" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>
        <span>Like</span>
      </button>
      <span class="grid min-h-11 min-w-11 place-items-center rounded-xl border border-line px-3 font-mono text-sm text-muted" id="like-count-{{ $slug }}">
        <span id="count-{{ $slug }}">0</span>
      </span>
    </div>
    <div class="like-message mt-3 hidden w-fit rounded-lg border border-line px-3 py-2 text-sm" id="like-message-{{ $slug }}"></div>
  </section>

  <script>
    (() => {
      const slug = {{ $slug | jsonify | safeJS }};
      const apiBase = {{ (.Site.Params.likes.apiBase | default "/api") | jsonify | safeJS }};
      const button = document.getElementById(`like-btn-${slug}`);
      const heart = document.getElementById(`heart-${slug}`);
      const spinner = document.getElementById(`spinner-${slug}`);
      const count = document.getElementById(`count-${slug}`);
      const message = document.getElementById(`like-message-${slug}`);

      function loading(active) {
        button.disabled = active;
        heart.classList.toggle("hidden", active);
        spinner.classList.toggle("hidden", !active);
      }

      function showMessage(text, kind) {
        message.textContent = text;
        message.className = `like-message mt-3 w-fit rounded-lg border px-3 py-2 text-sm ${kind}`;
        setTimeout(() => message.classList.add("hidden"), kind === "success" ? 3000 : 5000);
      }

      async function loadLikeCount() {
        loading(true);
        try {
          const response = await fetch(`${apiBase}/likes/${slug}`);
          const data = await response.json();
          if (data.success) count.textContent = data.total_likes;
        } catch (error) {
          console.error("Failed to load like count:", error);
        } finally {
          loading(false);
        }
      }

      window.handleLike = async function(postSlug) {
        if (postSlug !== slug) return;
        loading(true);
        try {
          const response = await fetch(`${apiBase}/like/${slug}`, { method: "POST" });
          const data = await response.json();
          if (!data.success) {
            showMessage(data.message || "Could not like this post", "error");
            return;
          }
          count.textContent = data.total_likes;
          heart.setAttribute("fill", "currentColor");
          button.classList.add("border-accent", "bg-accent-soft", "text-accent");
          showMessage("Thanks for liking this post!", "success");
        } catch (error) {
          console.error("Failed to like post:", error);
          showMessage("Network error. Please try again.", "error");
        } finally {
          loading(false);
        }
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadLikeCount);
      } else {
        loadLikeCount();
      }
    })();
  </script>
{{ end }}

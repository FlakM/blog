<header class="sticky top-0 z-50 border-b border-line/80 bg-canvas/85 backdrop-blur-xl">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5 sm:px-8">
    <a href="{{ relLangURL "" }}" class="group flex items-center gap-3 font-bold tracking-[-0.02em] text-ink-strong">
      <span class="grid size-8 place-items-center rounded-lg bg-ink-strong text-xs font-black tracking-tight text-canvas transition-transform group-hover:-rotate-3">MF</span>
      <span>{{ .Site.Title }}</span>
    </a>
    <nav class="hidden items-center gap-1 md:flex" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relLangURL }}" class="rounded-lg px-3 py-2 text-sm font-medium text-muted transition-colors hover:bg-panel-raised hover:text-ink-strong">{{ .Name }}</a>
      {{ end }}
      {{ partial "theme-toggle.html" . }}
    </nav>
    <div class="flex items-center gap-1 md:hidden">
      {{ partial "theme-toggle.html" . }}
      <details class="group relative">
        <summary class="grid size-10 cursor-pointer list-none place-items-center rounded-lg text-ink transition-colors hover:bg-panel-raised" aria-label="Open navigation">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </summary>
        <nav class="absolute right-0 top-12 w-52 rounded-2xl border border-line bg-panel p-2 shadow-2xl shadow-black/10" aria-label="Mobile navigation">
          {{ range .Site.Menus.main }}
            <a href="{{ .URL | relLangURL }}" class="block rounded-xl px-4 py-3 text-sm font-semibold text-ink transition-colors hover:bg-accent-soft hover:text-accent">{{ .Name }}</a>
          {{ end }}
        </nav>
      </details>
    </div>
  </div>
</header>
